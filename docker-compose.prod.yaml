# Produção — sobe db + api + caddy numa rede interna do compose.
#   docker compose -f docker-compose.prod.yaml up -d --build
#
# O docker-compose.yaml (dev) continua só com o banco e a porta 5435 exposta p/ local.
# Aqui o banco NÃO é exposto e só o Caddy publica portas (80/443) para a internet.

services:
  db:
    image: postgis/postgis:15-3.5-alpine
    container_name: horta_postgres
    restart: always
    # Segredos via .env (interpolação automática do compose). :? aborta o `up` se
    # a senha não estiver definida — evita subir Postgres com senha vazia.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-horta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-horta_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ escapa o $ para o compose: a variável é lida do ambiente do container.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5433:5432"

  api:
    build: .
    container_name: horta_api
    restart: always
    env_file: .env
    depends_on:
      db:
        condition: service_healthy   # só sobe a API quando o banco passa no healthcheck
    expose:
      - "8000"   # visível só na rede interna; sem `ports:` não vai p/ internet
    # Sem `ports:` → só o Caddy alcança a API (host `api`:8000).

  caddy:
    # Imagem própria: Caddy + build do frontend (ver frontend/Dockerfile).
    # A URL da API é fixada no build — o Vite embute o valor no JS gerado.
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: https://api.hortasurbanassm.com.br
    container_name: horta_caddy
    restart: always
    depends_on:
      - api
    # A máquina do CTISM fica atrás de NAT e não recebe conexão direta da internet.
    # O acesso entra pelo Cloudflare, que conecta no IP público do CTISM na 8443, e de
    # lá o encaminhamento leva até esta VM. Por isso só a 8443 é publicada: a 80 e a 443
    # daquele IP já pertencem a outro serviço.
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # estado interno do Caddy; persiste certificados quando houver
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

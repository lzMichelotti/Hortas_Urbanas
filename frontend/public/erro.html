<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hortas Urbanas</title>
    <!-- Unica tela possivel quando nem o HTML do site carrega. Imagem e fonte
         externas nao chegam aqui: so estilo inline. -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem 1.5rem;
        box-sizing: border-box;
        background: #121a14;
        color: #eaf3ec;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      h1 { margin: 0; font-size: 1.6rem; }
      p { margin: 0; max-width: 22rem; font-size: 1.15rem; line-height: 1.5; color: #9db3a2; }
      button {
        margin-top: 0.5rem;
        min-height: 3.5rem;
        padding: 0 2rem;
        border: 0;
        border-radius: 0.75rem;
        background: #5cb860;
        color: #121a14;
        font: inherit;
        font-size: 1.15rem;
        font-weight: 700;
      }
      button:disabled { opacity: 0.6; }
    </style>
  </head>
  <body>
    <div style="font-size: 3.5rem" aria-hidden="true">🌱</div>
    <h1>Não foi possível abrir</h1>
    <p>Veja se o seu celular está com internet e toque no botão abaixo.</p>
    <button type="button" id="tentar">Tentar de novo</button>
    <script>
      // Esta página vem do APK (https://localhost), sem a bridge do Capacitor:
      // reload() só recarregaria o próprio erro. Mesma URL de server.url.
      document.getElementById("tentar").addEventListener("click", function () {
        this.disabled = true
        this.textContent = "Carregando…"
        location.replace("https://app.hortasurbanassm.com.br/")
      })
    </script>
  </body>
</html>

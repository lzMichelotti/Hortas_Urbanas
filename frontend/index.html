<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#051e11" />
    <meta name="description" content="Hortas Urbanas — cuide da sua horta comunitária: plante, colha e acompanhe sua produção." />
    <title>Hortas Urbanas</title>
    <style>
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background: #051e11; color: #4ccc6f;
        font-family: system-ui, -apple-system, sans-serif; font-size: 16px;
      }
      #boot .ring {
        width: 44px; height: 44px; border: 5px solid #25734c;
        border-top-color: #4ccc6f; border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot .ring { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="ring"></div>
        <p>Carregando…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Mapa de Teste — Hortas Urbanas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Nunito', sans-serif; display: flex; flex-direction: column; height: 100vh; background: #f0f7f4; }

    #header {
      background: linear-gradient(135deg, #2d6a4f, #40916c);
      color: white;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    #header h1 { font-size: 1.1rem; font-weight: 800; letter-spacing: 0.3px; }
    #status {
      font-size: 0.78rem;
      font-weight: 600;
      background: rgba(255,255,255,0.2);
      padding: 5px 12px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }

    #conteudo { display: flex; flex: 1; overflow: hidden; }

    #painel {
      width: 280px;
      background: white;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      flex-shrink: 0;
      box-shadow: 2px 0 12px rgba(0,0,0,0.08);
    }

    .painel-titulo {
      font-size: 1rem;
      font-weight: 800;
      color: #1b4332;
    }

    .dica {
      font-size: 0.75rem;
      color: #95a5a6;
      text-align: center;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
    }
    .dica::before, .dica::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e0e0e0;
    }

    #btn-gps {
      background: linear-gradient(135deg, #2980b9, #1d6fa4);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 0.9rem;
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 12px rgba(29,111,164,0.35);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    #btn-gps:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(29,111,164,0.4); }
    #btn-gps:active { transform: translateY(0); }

    #ponto-selecionado {
      display: none;
      font-size: 0.78rem;
      font-weight: 600;
      background: #e8f5e9;
      border-radius: 10px;
      padding: 10px 12px;
      color: #2d6a4f;
      border-left: 3px solid #2d6a4f;
    }

    .raio-container { display: flex; flex-direction: column; gap: 6px; }
    .raio-header { display: flex; justify-content: space-between; align-items: center; }
    .raio-label { font-size: 0.82rem; font-weight: 700; color: #555; }
    .raio-badge {
      background: #d8f3dc;
      color: #1b4332;
      font-size: 0.82rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 20px;
    }

    #inp-raio {
      width: 100%;
      accent-color: #2d6a4f;
      cursor: pointer;
      height: 6px;
      border-radius: 4px;
      border: none;
      padding: 0;
    }

    .raio-escala {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      color: #aaa;
      font-weight: 600;
      padding: 0 2px;
    }

    #btn-buscar {
      background: linear-gradient(135deg, #2d6a4f, #40916c);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 800;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 12px rgba(45,106,79,0.35);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    #btn-buscar:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(45,106,79,0.4); }
    #btn-buscar:active { transform: translateY(0); }

    #btn-limpar {
      background: transparent;
      color: #bbb;
      border: 2px dashed #ddd;
      border-radius: 10px;
      padding: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      width: 100%;
      transition: all 0.15s;
    }
    #btn-limpar:hover { border-color: #aaa; color: #888; }

    #resultado {
      font-size: 0.82rem;
      font-weight: 700;
      color: #2d6a4f;
      background: linear-gradient(135deg, #d8f3dc, #b7e4c7);
      border-radius: 12px;
      padding: 12px;
      display: none;
      text-align: center;
      box-shadow: 0 2px 8px rgba(45,106,79,0.1);
    }
    #resultado .num {
      font-size: 1.8rem;
      font-weight: 800;
      display: block;
      line-height: 1.2;
    }

    #mapa { flex: 1; }

    .popup-horta { min-width: 190px; font-family: 'Nunito', sans-serif; }
    .popup-horta h3 { color: #2d6a4f; margin-bottom: 6px; font-size: 0.95rem; font-weight: 800; }
    .popup-horta p { font-size: 0.82rem; color: #555; margin: 3px 0; }
    .popup-horta .tag {
      display: inline-block;
      background: #d8f3dc;
      color: #1b4332;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      margin-top: 8px;
    }

    /* Marcador da horta segura */
    .marcador-horta {
      width: 36px;
      height: 36px;
      background: #2d6a4f;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .marcador-horta::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Marcador da horta dentro de zona de risco */
    .marcador-horta-risco {
      width: 36px;
      height: 36px;
      background: #e63946;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .marcador-horta-risco::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Marcador alerta — até 1km da zona */
    .marcador-horta-alerta {
      width: 36px;
      height: 36px;
      background: #e76f00;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .marcador-horta-alerta::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Marcador monitoramento — entre 1km e 4km da zona */
    .marcador-horta-monitoramento {
      width: 36px;
      height: 36px;
      background: #457b9d;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .marcador-horta-monitoramento::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Popup zona de risco */
    .popup-zona { min-width: 180px; font-family: 'Nunito', sans-serif; }
    .popup-zona h3 { margin-bottom: 6px; font-size: 0.95rem; font-weight: 800; }
    .popup-zona p { font-size: 0.82rem; color: #555; margin: 3px 0; }
    .popup-zona .nivel {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      margin-top: 8px;
      color: white;
    }
    .nivel-alto   { background: #e63946; }
    .nivel-medio  { background: #f4a261; }
    .nivel-baixo  { background: #e9c46a; color: #333; }

    /* Legenda */
    .legenda-titulo {
      font-size: 0.82rem;
      font-weight: 800;
      color: #555;
    }
    .legenda-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #555;
    }
    .legenda-cor {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* Marcador do ponto de busca */
    .marcador-ponto {
      width: 16px;
      height: 16px;
      background: #1d6fa4;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 0 0 2px #1d6fa4, 0 2px 6px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

<div id="header">
  <h1>Hortas Urbanas — Mapa</h1>
  <span id="status">Carregando...</span>
</div>

<div id="conteudo">
  <div id="painel">

    <div class="painel-titulo">Busca por Proximidade</div>

    <button id="btn-gps" onclick="usarMinhaLocalizacao()">Usar minha localização</button>

    <div class="dica">ou clique no mapa</div>

    <div id="ponto-selecionado">Ponto selecionado</div>

    <div class="raio-container">
      <div class="raio-header">
        <span class="raio-label">Raio de busca</span>
        <span class="raio-badge"><span id="raio-valor">2</span> km</span>
      </div>
      <input id="inp-raio" type="range" min="0.5" max="20" step="0.5" value="2" oninput="atualizarRaio(this.value)" />
      <div class="raio-escala"><span>0,5 km</span><span>10 km</span><span>20 km</span></div>
    </div>

    <button id="btn-buscar" onclick="buscarProximas()">Buscar hortas próximas</button>

    <button id="btn-limpar" onclick="limparBusca()">Limpar busca</button>

    <div id="resultado"></div>

    <div class="dica">hortas</div>

    <div class="legenda-titulo">Situação</div>
    <div class="legenda-item"><div class="legenda-cor" style="background:#2d6a4f;border-radius:50%"></div> Segura</div>
    <div class="legenda-item"><div class="legenda-cor" style="background:#457b9d;border-radius:50%"></div> Monitoramento (até 4km)</div>
    <div class="legenda-item"><div class="legenda-cor" style="background:#e76f00;border-radius:50%"></div> Alerta (até 1km)</div>
    <div class="legenda-item"><div class="legenda-cor" style="background:#e63946;border-radius:50%"></div> Dentro de zona de risco</div>

    <div class="dica">zonas de risco</div>

    <div class="legenda-titulo">Nivel de risco</div>
    <div class="legenda-item"><div class="legenda-cor" style="background:#e63946"></div> Alto</div>
    <div class="legenda-item"><div class="legenda-cor" style="background:#f4a261"></div> Medio</div>
    <div class="legenda-item"><div class="legenda-cor" style="background:#e9c46a"></div> Baixo</div>

  </div>

  <div id="mapa"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const API = "http://127.0.0.1:8000";

  const mapa = L.map("mapa", { preferCanvas: true }).setView([-15.7801, -47.9292], 5);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '© <a href="https://www.openstreetmap.org/">OpenStreetMap</a>',
    maxZoom: 19,
    detectRetina: true,
  }).addTo(mapa);

  const iconeHorta = L.divIcon({
    html: '<div class="marcador-horta"></div>',
    className: "",
    iconSize: [36, 36],
    iconAnchor: [18, 36],
    popupAnchor: [0, -38],
  });

  const iconeHortaRisco = L.divIcon({
    html: '<div class="marcador-horta-risco"></div>',
    className: "",
    iconSize: [36, 36],
    iconAnchor: [18, 36],
    popupAnchor: [0, -38],
  });

  const iconeHortaAlerta = L.divIcon({
    html: '<div class="marcador-horta-alerta"></div>',
    className: "",
    iconSize: [36, 36],
    iconAnchor: [18, 36],
    popupAnchor: [0, -38],
  });

  const iconeHortaMonitoramento = L.divIcon({
    html: '<div class="marcador-horta-monitoramento"></div>',
    className: "",
    iconSize: [36, 36],
    iconAnchor: [18, 36],
    popupAnchor: [0, -38],
  });

  const iconePonto = L.divIcon({
    html: '<div class="marcador-ponto"></div>',
    className: "",
    iconSize: [16, 16],
    iconAnchor: [8, 8],
  });

  const coresRisco = { alto: "#e63946", medio: "#f4a261", baixo: "#e9c46a" };

  let layerHortas = null;
  let layerZonas = null;
  let layerBusca = null;
  let pontoBusca = null;
  let marcadorPonto = null;
  let circuloBusca = null;
  let situacaoMap = {};
  let _debounceRaio = null;
  let _abortBusca = null;

  function atualizarRaio(valor) {
    document.getElementById("raio-valor").textContent = valor;
    if (circuloBusca) circuloBusca.setRadius(valor * 1000);
    if (pontoBusca) {
      clearTimeout(_debounceRaio);
      _debounceRaio = setTimeout(buscarProximas, 400);
    }
  }

  function definirPonto(lat, lng) {
    pontoBusca = { lat, lng };

    if (marcadorPonto) mapa.removeLayer(marcadorPonto);
    marcadorPonto = L.marker([lat, lng], { icon: iconePonto, draggable: true }).addTo(mapa);

    marcadorPonto.on("drag", function (e) {
      const pos = e.latlng;
      pontoBusca = { lat: pos.lat, lng: pos.lng };
      if (circuloBusca) circuloBusca.setLatLng(pos);
      document.getElementById("ponto-selecionado").textContent =
        `${pos.lat.toFixed(5)}, ${pos.lng.toFixed(5)}`;
    });

    const el = document.getElementById("ponto-selecionado");
    el.style.display = "block";
    el.textContent = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  }

  mapa.on("click", function (e) {
    definirPonto(e.latlng.lat, e.latlng.lng);
  });

  function usarMinhaLocalizacao() {
    if (!navigator.geolocation) {
      alert("Seu navegador não suporta geolocalização.");
      return;
    }
    const btn = document.getElementById("btn-gps");
    btn.textContent = "Obtendo localização...";
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        definirPonto(pos.coords.latitude, pos.coords.longitude);
        mapa.setView([pos.coords.latitude, pos.coords.longitude], 13);
        btn.textContent = "Usar minha localização";
      },
      () => {
        alert("Não foi possível obter sua localização.");
        btn.textContent = "Usar minha localização";
      }
    );
  }

  async function carregarHortas() {
    try {
      const resp = await fetch(`${API}/mapa/completo?raio_alerta_km=1&raio_monitoramento_km=4`);
      if (!resp.ok) throw new Error(`Erro ${resp.status}`);
      const geojson = await resp.json();

      situacaoMap = {};
      geojson.features.forEach(f => { situacaoMap[f.properties.id] = f.properties.situacao; });

      const total         = geojson.features.length;
      const dentro        = geojson.features.filter(f => f.properties.situacao === "dentro").length;
      const alerta        = geojson.features.filter(f => f.properties.situacao === "alerta").length;
      const monitoramento = geojson.features.filter(f => f.properties.situacao === "monitoramento").length;

      if (total === 0) {
        document.getElementById("status").textContent = "Nenhuma horta cadastrada";
        return;
      }

      const partes = [];
      if (dentro > 0)        partes.push(`${dentro} em risco`);
      if (alerta > 0)        partes.push(`${alerta} em alerta`);
      if (monitoramento > 0) partes.push(`${monitoramento} em monitoramento`);
      document.getElementById("status").textContent =
        partes.length > 0
          ? `${total} horta(s) — ${partes.join(", ")}`
          : `${total} horta(s) no mapa`;

      layerHortas = L.geoJSON(geojson, {
        pointToLayer: (feature, latlng) => {
          const s = feature.properties.situacao;
          const icone = s === "dentro"        ? iconeHortaRisco
                      : s === "alerta"        ? iconeHortaAlerta
                      : s === "monitoramento" ? iconeHortaMonitoramento
                      : iconeHorta;
          return L.marker(latlng, { icon: icone });
        },
        onEachFeature: (feature, layer) => layer.bindPopup(() => _popupHtml(feature)),
      }).addTo(mapa);

      mapa.fitBounds(layerHortas.getBounds(), { padding: [40, 40], maxZoom: 16 });

    } catch (err) {
      document.getElementById("status").textContent = "Erro ao conectar na API";
      console.error(err);
    }
  }

  async function buscarProximas() {
    if (!pontoBusca) {
      alert("Clique no mapa ou use sua localização para definir o ponto de busca.");
      return;
    }
    const { lat, lng } = pontoBusca;
    const raioKm = parseFloat(document.getElementById("inp-raio").value);

    _limparResultados();
    if (marcadorPonto) { mapa.removeLayer(marcadorPonto); marcadorPonto = null; }
    if (layerHortas) mapa.removeLayer(layerHortas);

    try {
      if (_abortBusca) _abortBusca.abort();
      _abortBusca = new AbortController();
      const resp = await fetch(`${API}/hortas/proximas?lat=${lat}&lng=${lng}&raio_km=${raioKm}`, { signal: _abortBusca.signal });
      if (!resp.ok) throw new Error(`Erro ${resp.status}`);
      const geojson = await resp.json();

      const grupo = L.layerGroup().addTo(mapa);

      L.marker([lat, lng], { icon: iconePonto }).addTo(grupo);

      circuloBusca = L.circle([lat, lng], {
        radius: raioKm * 1000,
        color: "#1d6fa4",
        fillColor: "#90caf9",
        fillOpacity: 0.2,
        weight: 2,
        dashArray: "6",
      }).addTo(grupo);

      circuloBusca.on("mouseover", function () {
        circuloBusca.setStyle({ fillOpacity: 0.4 });
      });
      circuloBusca.on("mouseout", function () {
        circuloBusca.setStyle({ fillOpacity: 0.2 });
      });

      const total = geojson.features.length;
      if (total > 0) {
        geojson.features.forEach(f => {
          f.properties.situacao = situacaoMap[f.properties.id];
        });
        L.geoJSON(geojson, {
          pointToLayer: (feature, latlng) => {
            const s = feature.properties.situacao;
            const icone = s === "dentro"        ? iconeHortaRisco
                        : s === "alerta"        ? iconeHortaAlerta
                        : s === "monitoramento" ? iconeHortaMonitoramento
                        : iconeHorta;
            return L.marker(latlng, { icon: icone });
          },
          onEachFeature: (feature, layer) => layer.bindPopup(() => _popupHtml(feature)),
        }).addTo(grupo);
      }

      layerBusca = grupo;
      mapa.fitBounds(circuloBusca.getBounds(), { padding: [40, 40] });

      const resultado = document.getElementById("resultado");
      resultado.style.display = "block";
      resultado.innerHTML = total === 0
        ? `<span class="num">0</span>hortas encontradas num raio de ${raioKm} km`
        : `<span class="num">${total}</span>horta(s) encontrada(s) num raio de ${raioKm} km`;

    } catch (err) {
      if (err.name === 'AbortError') return;
      if (layerHortas) mapa.addLayer(layerHortas);
      console.error(err);
    }
  }

  function _limparResultados() {
    if (layerBusca) { mapa.removeLayer(layerBusca); layerBusca = null; }
    circuloBusca = null;
  }

  function limparBusca() {
    _limparResultados();
    if (layerHortas) mapa.addLayer(layerHortas);
    if (marcadorPonto) { mapa.removeLayer(marcadorPonto); marcadorPonto = null; }
    pontoBusca = null;
    document.getElementById("ponto-selecionado").style.display = "none";
    document.getElementById("resultado").style.display = "none";
  }

  function _popupHtml(feature) {
    const p = feature.properties;
    const endereco = [p.rua, p.numero, p.bairro, p.cidade, p.uf]
      .filter(Boolean)
      .join(", ");

    const tagRisco = p.situacao === "dentro"
      ? `<span class="tag" style="background:#fde8ea;color:#e63946">
           Dentro de zona de risco${p.zona_risco ? `: ${p.zona_risco.tipo} (${p.zona_risco.nivel})` : ""}
         </span>`
      : p.situacao === "alerta"
      ? `<span class="tag" style="background:#fff0e0;color:#e76f00">
           Alerta — até 1km de zona de risco${p.zona_risco ? `: ${p.zona_risco.tipo}` : ""}
         </span>`
      : p.situacao === "monitoramento"
      ? `<span class="tag" style="background:#e8f1f8;color:#457b9d">
           Monitoramento — até 4km de zona de risco${p.zona_risco ? `: ${p.zona_risco.tipo}` : ""}
         </span>`
      : `<span class="tag">Fora de zona de risco</span>`;

    return `
      <div class="popup-horta">
        <h3>${p.nome}</h3>
        ${endereco ? `<p>${endereco}</p>` : ""}
        ${p.area_total ? `<p>Area: ${p.area_total} m²</p>` : ""}
        ${p.publico_atendido ? `<p>${p.publico_atendido}</p>` : ""}
        ${tagRisco}
      </div>
    `;
  }

  async function carregarZonasRisco() {
    try {
      const resp = await fetch(`${API}/mapa/riscos`);
      if (!resp.ok) throw new Error(`Erro ${resp.status}`);
      const geojson = await resp.json();

      if (geojson.features.length === 0) return;

      layerZonas = L.geoJSON(geojson, {
        style: (feature) => {
          const nivel = feature.properties.nivel;
          const cor = coresRisco[nivel] ?? "#aaa";
          return {
            color: cor,
            weight: 2,
            fillColor: cor,
            fillOpacity: 0.2,
          };
        },
        onEachFeature: (feature, layer) => {
          const p = feature.properties;
          layer.bindPopup(() => `
            <div class="popup-zona">
              <h3>${p.nome}</h3>
              <p>Tipo: ${p.tipo}</p>
              ${p.descricao ? `<p>${p.descricao}</p>` : ""}
              <span class="nivel nivel-${p.nivel}">${p.nivel.charAt(0).toUpperCase() + p.nivel.slice(1)}</span>
            </div>
          `);
          layer.on("mouseover", function () {
            layer.setStyle({ fillOpacity: 0.45 });
          });
          layer.on("mouseout", function () {
            layer.setStyle({ fillOpacity: 0.2 });
          });
        },
      }).addTo(mapa);

    } catch (err) {
      console.error("Erro ao carregar zonas de risco:", err);
    }
  }

  carregarHortas();
  carregarZonasRisco();
</script>
</body>
</html>
